name: auth_flow_app
description: "A new Flutter project."
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_bloc: ^9.1.1
  equatable: ^2.1.0

  # Dependency Injection
  get_it: ^9.2.1

  # Functional Programming & Error Handling
  dartz: ^0.10.1

  # UI Components
  cupertino_icons: ^1.0.9

  # Image Picker
  image_picker: ^1.2.3

  # HTTP
  http: ^1.6.0

  supabase_flutter: ^2.17.2
  flutter_dotenv: ^6.0.1
  pinput: ^6.0.2
  google_sign_in: ^7.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - .env